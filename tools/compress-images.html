<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compress Images - Squeeze</title>
<meta name="description" content="Compress JPG, PNG, WebP images offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#f43f5e,#fb923c)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </div>
      <div class="tool-page-title"><h1>Compress Images</h1><p>Shrink JPG, PNG, WebP with quality control</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:800px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept="image/*" multiple>
    <span class="drop-icon">&#128444;</span>
    <p class="drop-text">Drop images here (multiple allowed)</p>
    <p class="drop-hint">JPG, PNG, WebP, AVIF supported</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Output Format</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="fmt" value="same" checked> <span>Keep Original</span></label>
        <label class="radio-pill"><input type="radio" name="fmt" value="image/jpeg"> <span>JPG</span></label>
        <label class="radio-pill"><input type="radio" name="fmt" value="image/webp"> <span>WebP</span></label>
        <label class="radio-pill"><input type="radio" name="fmt" value="image/png"> <span>PNG</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Quality</span>
      <div class="slider-wrap">
        <input type="range" id="quality" min="20" max="100" value="80">
        <span class="slider-val" id="q-val">80%</span>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Max Size</span>
      <select id="max-dim">
        <option value="99999">No Resize</option>
        <option value="3840">4K (3840px)</option>
        <option value="1920">FHD (1920px)</option>
        <option value="1280">HD (1280px)</option>
        <option value="800">800px</option>
      </select>
    </div>
  </div>
  <div id="file-list" class="file-list" hidden></div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Compress All</button>
    <button class="btn-secondary" id="add-more">&#43; Add More</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const fileList = $('#file-list'), actionRow = $('#action-row'), summary = $('#summary');
  const quality = $('#quality'), qVal = $('#q-val');
  let images = [], results = [];

  quality.addEventListener('input', () => qVal.textContent = quality.value + '%');

  function addImages(newFiles) {
    const allowed = ['image/jpeg','image/png','image/webp','image/avif','image/gif','image/bmp'];
    newFiles.filter(f => allowed.includes(f.type) || /\.(jpe?g|png|webp|avif|gif|bmp)$/i.test(f.name)).forEach(f => images.push(f));
    render();
  }

  function render() {
    fileList.innerHTML = '';
    if (!images.length) { controls.hidden = true; actionRow.hidden = true; fileList.hidden = true; return; }
    controls.hidden = false; actionRow.hidden = false; fileList.hidden = false;
    images.forEach((f, i) => {
      const url = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'file-item';
      item.id = 'item-' + i;
      item.innerHTML = `
        <div class="file-thumb"><img src="${url}" alt="${f.name}"></div>
        <div class="file-meta"><div class="file-name">${f.name}</div><div class="file-size">${fmt(f.size)}</div></div>
        <span class="file-status pending" id="st-${i}">Ready</span>
        <div class="file-action" id="act-${i}" hidden></div>`;
      fileList.appendChild(item);
    });
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!images.length) return;
    const q = parseInt(quality.value) / 100;
    const maxDim = parseInt($('#max-dim').value);
    const fmtSel = document.querySelector('input[name=fmt]:checked').value;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Compressing...';
    results = [];

    for (let i = 0; i < images.length; i++) {
      const f = images[i];
      const st = $('#st-' + i), act = $('#act-' + i);
      st.textContent = 'Working...'; st.className = 'file-status working';
      try {
        const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
        const w0 = bmp.width, h0 = bmp.height;
        const k = Math.min(1, maxDim / Math.max(w0, h0));
        const w = Math.round(w0 * k), h = Math.round(h0 * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bmp, 0, 0, w, h);
        bmp.close?.();
        let outFmt = fmtSel === 'same' ? (f.type || 'image/jpeg') : fmtSel;
        if (!['image/jpeg','image/png','image/webp'].includes(outFmt)) outFmt = 'image/jpeg';
        const blob = await new Promise(r => c.toBlob(r, outFmt, q));
        const ext = outFmt === 'image/jpeg' ? 'jpg' : outFmt === 'image/png' ? 'png' : 'webp';
        const outName = stem(f.name) + '_sq.' + ext;
        results.push({ blob, name: outName, orig: f.size });
        st.textContent = savings(f.size, blob.size); st.className = 'file-status done';
        act.hidden = false;
        const btn = document.createElement('button');
        btn.textContent = 'Save';
        btn.addEventListener('click', () => download(blob, outName));
        act.appendChild(btn);
      } catch(e) {
        st.textContent = 'Error'; st.className = 'file-status error';
      }
    }
    summary.hidden = false;
    const totOrig = results.reduce((a,r) => a + r.orig, 0);
    const totComp = results.reduce((a,r) => a + r.blob.size, 0);
    summary.innerHTML = `<strong>${results.length} images: ${savings(totOrig, totComp)}</strong><br>
      <div class="action-row"><button class="btn-primary" id="dl-all-btn">&#8659; Download All as ZIP</button></div>`;
    $('#dl-all-btn').addEventListener('click', async () => {
      const JSZip = await getJsZip();
      const zip = new JSZip();
      for (const r of results) zip.file(r.name, r.blob);
      const zb = await zip.generateAsync({ type: 'blob' });
      download(zb, nameFor(images) + '_compressed.zip');
    });
    toast('All compressed!', 'success');
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Compress All';
  });

  fileIn.addEventListener('change', () => addImages([...fileIn.files]));
  setupDrop(drop, fs => addImages(fs), true);
  $('#add-more').addEventListener('click', () => fileIn.click());
  $('#reset-btn').addEventListener('click', () => { images = []; results = []; render(); summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
