<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edit PDF Metadata - Squeeze</title>
<meta name="description" content="Edit PDF title, author, subject metadata offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#64748b,#3b82f6)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div class="tool-page-title"><h1>Edit PDF Metadata</h1><p>Change title, author, subject, keywords and more</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:700px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept=".pdf,application/pdf">
    <span class="drop-icon">&#128196;</span>
    <p class="drop-text">Drop your PDF here</p>
    <p class="drop-hint">Current metadata will be pre-filled</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row"><span class="control-label">Title</span><input type="text" id="meta-title" style="flex:1" placeholder="Document title"></div>
    <div class="control-row"><span class="control-label">Author</span><input type="text" id="meta-author" style="flex:1" placeholder="Author name"></div>
    <div class="control-row"><span class="control-label">Subject</span><input type="text" id="meta-subject" style="flex:1" placeholder="Subject"></div>
    <div class="control-row"><span class="control-label">Keywords</span><input type="text" id="meta-keywords" style="flex:1" placeholder="comma, separated, keywords"></div>
    <div class="control-row"><span class="control-label">Creator</span><input type="text" id="meta-creator" style="flex:1" placeholder="App that created this"></div>
    <div class="control-row"><span class="control-label">Producer</span><input type="text" id="meta-producer" style="flex:1" placeholder="PDF producer"></div>
  </div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Save Metadata</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const actionRow = $('#action-row'), summary = $('#summary');
  let currentFile = null, pdfDoc = null;

  async function loadFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Please select a PDF', 'error'); return; }
    currentFile = file;
    const ab = await file.arrayBuffer();
    const { PDFDocument } = await getPdfLib();
    pdfDoc = await PDFDocument.load(ab, { ignoreEncryption: true });
    $('#meta-title').value = pdfDoc.getTitle() || '';
    $('#meta-author').value = pdfDoc.getAuthor() || '';
    $('#meta-subject').value = pdfDoc.getSubject() || '';
    $('#meta-keywords').value = pdfDoc.getKeywords() || '';
    $('#meta-creator').value = pdfDoc.getCreator() || '';
    $('#meta-producer').value = pdfDoc.getProducer() || '';
    controls.hidden = false; actionRow.hidden = false;
    toast('Metadata loaded', 'success');
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!pdfDoc) return;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Saving...';
    try {
      pdfDoc.setTitle($('#meta-title').value);
      pdfDoc.setAuthor($('#meta-author').value);
      pdfDoc.setSubject($('#meta-subject').value);
      pdfDoc.setKeywords($('#meta-keywords').value.split(',').map(k => k.trim()).filter(Boolean));
      pdfDoc.setCreator($('#meta-creator').value);
      pdfDoc.setProducer($('#meta-producer').value);
      pdfDoc.setModificationDate(new Date());
      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>Metadata updated &rarr; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      $('#dl-btn').addEventListener('click', () => download(blob, stem(currentFile.name) + '_meta.pdf'));
      toast('Metadata saved!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Save Metadata';
  });

  fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); });
  setupDrop(drop, files => loadFile(files[0]));
  $('#reset-btn').addEventListener('click', () => { currentFile = null; pdfDoc = null; controls.hidden = true; actionRow.hidden = true; summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
