<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Images to PDF - Squeeze</title>
<meta name="description" content="Convert images to PDF offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#e879f9,#8b5cf6)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><rect x="8" y="13" width="8" height="6" rx="1"/><circle cx="10" cy="15" r="1"/></svg>
      </div>
      <div class="tool-page-title"><h1>Images to PDF</h1><p>Combine JPG, PNG, WebP images into a single PDF</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:900px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept="image/*" multiple>
    <span class="drop-icon">&#128444;</span>
    <p class="drop-text">Click here, or drop your images</p>
    <p class="drop-hint">You can pick many at once. JPG, PNG, WebP, GIF, BMP</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Page Size</span>
      <select id="page-size">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="A3">A3</option>
        <option value="fit">Fit to Image</option>
      </select>
    </div>
    <div class="control-row">
      <span class="control-label">Orientation</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="ori" value="auto" checked> <span>Auto</span></label>
        <label class="radio-pill"><input type="radio" name="ori" value="portrait"> <span>Portrait</span></label>
        <label class="radio-pill"><input type="radio" name="ori" value="landscape"> <span>Landscape</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Margin</span>
      <select id="margin">
        <option value="0">No Margin</option>
        <option value="20" selected>Small (20pt)</option>
        <option value="40">Normal (40pt)</option>
        <option value="60">Large (60pt)</option>
      </select>
    </div>
  </div>
  <div class="img-grid" id="img-grid"></div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Create PDF</button>
    <button class="btn-secondary" id="add-more">&#43; Add More</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const imgGrid = $('#img-grid'), actionRow = $('#action-row'), summary = $('#summary');
  let images = [];   // { file, url, rot }   rot = extra rotation chosen by the user (0/90/180/270)

  function addImages(newFiles) {
    const ok = f => /^image\/(jpeg|png|webp|gif|bmp|avif|heic|heif)$/.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i.test(f.name);
    newFiles.filter(ok).forEach(f => images.push({ file: f, url: URL.createObjectURL(f), rot: 0 }));
    render();
  }

  function render() {
    imgGrid.innerHTML = '';
    if (!images.length) { controls.hidden = true; actionRow.hidden = true; return; }
    controls.hidden = false; actionRow.hidden = false;
    images.forEach((it, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-thumb';
      wrap.innerHTML = `<div class="img-box"><img src="${it.url}" alt="${esc(it.file.name)}" style="transform:rotate(${it.rot}deg)"></div>
        <div class="img-name" title="${esc(it.file.name)}">${esc(it.file.name)}</div>
        <div class="img-meta">Page ${i + 1} &middot; ${fmt(it.file.size)}</div>
        <div class="img-btns">
          <button type="button" title="Rotate left" aria-label="Rotate left" data-a="l">&#8634;</button>
          <button type="button" title="Rotate right" aria-label="Rotate right" data-a="r">&#8635;</button>
          <button type="button" title="Move earlier" aria-label="Move earlier" data-a="u" ${i === 0 ? 'disabled' : ''}>&larr;</button>
          <button type="button" title="Move later" aria-label="Move later" data-a="d" ${i === images.length - 1 ? 'disabled' : ''}>&rarr;</button>
          <button type="button" title="Remove" aria-label="Remove" data-a="x">&#10005;</button>
        </div>`;
      wrap.querySelector('.img-btns').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const a = b.dataset.a;
        if (a === 'l') it.rot = (it.rot + 270) % 360;
        else if (a === 'r') it.rot = (it.rot + 90) % 360;
        else if (a === 'x') { URL.revokeObjectURL(it.url); images.splice(i, 1); }
        else if (a === 'u' && i > 0) [images[i - 1], images[i]] = [images[i], images[i - 1]];
        else if (a === 'd' && i < images.length - 1) [images[i + 1], images[i]] = [images[i], images[i + 1]];
        render();
      });
      imgGrid.appendChild(wrap);
    });
  }

  const PAGE_SIZES = { A4: [595.28, 841.89], Letter: [612, 792], A3: [841.89, 1190.55] };

  // Decode with the camera's EXIF orientation applied (so phone photos come out upright), then apply the user's rotation.
  async function toCanvas(it) {
    let bmp;
    try { bmp = await createImageBitmap(it.file, { imageOrientation: 'from-image' }); }
    catch { try { bmp = await createImageBitmap(it.file); } catch { throw new Error('Cannot read ' + it.file.name + ' in this browser.'); } }
    const swap = it.rot % 180 !== 0, w = swap ? bmp.height : bmp.width, h = swap ? bmp.width : bmp.height;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    x.translate(w / 2, h / 2); x.rotate(it.rot * Math.PI / 180);
    x.drawImage(bmp, -bmp.width / 2, -bmp.height / 2);
    if (bmp.close) bmp.close();
    return c;
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!images.length) return;
    $('#run-btn').disabled = true;
    try {
      const { PDFDocument } = await getPdfLib();
      const pdf = await PDFDocument.create();
      const pageSz = $('#page-size').value;
      const ori = document.querySelector('input[name=ori]:checked').value;
      const margin = parseInt($('#margin').value);
      let n = 0;
      for (const it of images) {
        $('#run-btn').innerHTML = '<span class="spinner"></span> Adding image ' + (++n) + ' of ' + images.length + '...';
        const c = await toCanvas(it);
        const png = /png$/i.test(it.file.type) || /\.png$/i.test(it.file.name);
        const blob = await new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.92));
        const iw = c.width, ih = c.height; c.width = c.height = 0;
        if (!blob) throw new Error('Could not process ' + it.file.name);
        const bytes = await blob.arrayBuffer();
        const img = png ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);

        let pw, ph;
        if (pageSz === 'fit') { pw = iw * 0.75; ph = ih * 0.75; }
        else {
          [pw, ph] = PAGE_SIZES[pageSz] || PAGE_SIZES.A4;
          const land = ori === 'auto' ? iw > ih : ori === 'landscape';
          if (land !== (pw > ph)) [pw, ph] = [ph, pw];
        }
        const page = pdf.addPage([pw, ph]);
        const m = pageSz === 'fit' ? 0 : margin, avW = pw - m * 2, avH = ph - m * 2;
        const scale = Math.min(avW / iw, avH / ih);
        const w = iw * scale, h = ih * scale;
        page.drawImage(img, { x: m + (avW - w) / 2, y: m + (avH - h) / 2, width: w, height: h });
        await new Promise(r => setTimeout(r));
      }

      const blob = new Blob([await pdf.save()], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>${images.length} image${images.length > 1 ? 's' : ''} combined &rarr; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      const outName = nameFor(images.map(i => i.file)) + '_images.pdf';
      $('#dl-btn').addEventListener('click', () => download(blob, outName));
      toast('PDF created!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Create PDF';
  });

  fileIn.addEventListener('change', () => { addImages([...fileIn.files]); fileIn.value = ''; });
  setupDrop(drop, fs => addImages(fs), true);
  $('#add-more').addEventListener('click', () => fileIn.click());
  $('#reset-btn').addEventListener('click', () => { images.forEach(i => URL.revokeObjectURL(i.url)); images = []; render(); summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
