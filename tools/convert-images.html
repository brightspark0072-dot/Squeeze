<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Convert Images - Squeeze</title>
<meta name="description" content="Convert image formats offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#a855f7,#ec4899)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </div>
      <div class="tool-page-title"><h1>Convert Images</h1><p>Convert between JPG, PNG, WebP, AVIF formats</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:800px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept="image/*" multiple>
    <span class="drop-icon">&#128444;</span>
    <p class="drop-text">Drop images here</p>
    <p class="drop-hint">Batch convert multiple images at once</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Convert To</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="to" value="image/jpeg" checked> <span>JPG</span></label>
        <label class="radio-pill"><input type="radio" name="to" value="image/png"> <span>PNG</span></label>
        <label class="radio-pill"><input type="radio" name="to" value="image/webp"> <span>WebP</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Quality</span>
      <div class="slider-wrap">
        <input type="range" id="quality" min="50" max="100" value="90">
        <span class="slider-val" id="q-val">90%</span>
      </div>
    </div>
  </div>
  <div id="file-list" class="file-list" hidden></div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Convert All</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const fileList = $('#file-list'), actionRow = $('#action-row'), summary = $('#summary');
  const quality = $('#quality'), qVal = $('#q-val');
  let images = [], results = [];

  quality.addEventListener('input', () => qVal.textContent = quality.value + '%');

  function addImages(newFiles) {
    newFiles.filter(f => f.type.startsWith('image/')).forEach(f => images.push(f));
    render();
  }

  function render() {
    fileList.innerHTML = '';
    if (!images.length) { controls.hidden = true; actionRow.hidden = true; fileList.hidden = true; return; }
    controls.hidden = false; actionRow.hidden = false; fileList.hidden = false;
    images.forEach((f, i) => {
      const url = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <div class="file-thumb"><img src="${url}" alt="${esc(f.name)}"></div>
        <div class="file-meta"><div class="file-name">${esc(f.name)}</div><div class="file-size">${fmt(f.size)}</div></div>
        <span class="file-status pending" id="st-${i}">Ready</span>
        <div class="file-action" id="act-${i}" hidden></div>`;
      fileList.appendChild(item);
    });
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!images.length) return;
    const outFmt = document.querySelector('input[name=to]:checked').value;
    const ext = outFmt === 'image/jpeg' ? 'jpg' : outFmt === 'image/png' ? 'png' : 'webp';
    const q = parseInt(quality.value) / 100;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Converting...';
    results = [];

    for (let i = 0; i < images.length; i++) {
      const f = images[i];
      const st = $('#st-' + i), act = $('#act-' + i);
      st.textContent = 'Converting...'; st.className = 'file-status working';
      try {
        const bmp = await createImageBitmap(f);
        const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
        c.getContext('2d').drawImage(bmp, 0, 0);
        bmp.close?.();
        const blob = await new Promise(r => c.toBlob(r, outFmt, q));
        const outName = stem(f.name) + '_converted.' + ext;
        results.push({ blob, name: outName });
        st.textContent = fmt(f.size) + ' \u2192 ' + fmt(blob.size); st.className = 'file-status done';
        act.hidden = false;
        const btn = document.createElement('button');
        btn.textContent = 'Save';
        btn.addEventListener('click', () => download(blob, outName));
        act.appendChild(btn);
      } catch(e) { st.textContent = 'Error'; st.className = 'file-status error'; }
    }

    summary.hidden = false;
    summary.innerHTML = `<strong>${results.length} images converted to ${ext.toUpperCase()}</strong><br>
      <div class="action-row"><button class="btn-primary" id="dl-all">&#8659; Download All as ZIP</button></div>`;
    $('#dl-all').addEventListener('click', async () => {
      const JSZip = await getJsZip();
      const zip = new JSZip();
      for (const r of results) zip.file(r.name, r.blob);
      download(await zip.generateAsync({ type: 'blob' }), nameFor(images) + '_converted.zip');
    });
    toast('All converted!', 'success');
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Convert All';
  });

  fileIn.addEventListener('change', () => addImages([...fileIn.files]));
  setupDrop(drop, fs => addImages(fs), true);
  $('#reset-btn').addEventListener('click', () => { images = []; results = []; render(); summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
