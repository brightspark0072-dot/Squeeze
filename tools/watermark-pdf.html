<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watermark PDF - Squeeze</title>
<meta name="description" content="Add text watermarks to PDF offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M8 12h8M12 8v8"/></svg>
      </div>
      <div class="tool-page-title"><h1>Watermark PDF</h1><p>Add diagonal text watermarks to every page</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:800px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept=".pdf,application/pdf">
    <span class="drop-icon">&#128196;</span>
    <p class="drop-text">Drop your PDF here</p>
    <p class="drop-hint">Configure the watermark below, then apply</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Watermark Text</span>
      <input type="text" id="wm-text" value="CONFIDENTIAL" style="flex:1">
    </div>
    <div class="control-row">
      <span class="control-label">Font Size</span>
      <div class="slider-wrap">
        <input type="range" id="wm-size" min="20" max="200" value="90">
        <span class="slider-val" id="size-val">90</span>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Opacity</span>
      <div class="slider-wrap">
        <input type="range" id="wm-opacity" min="5" max="100" value="35">
        <span class="slider-val" id="op-val">35%</span>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Color</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="wm-color" value="gray" checked> <span>Gray</span></label>
        <label class="radio-pill"><input type="radio" name="wm-color" value="red"> <span>Red</span></label>
        <label class="radio-pill"><input type="radio" name="wm-color" value="blue"> <span>Blue</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Position</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="wm-pos" value="diagonal" checked> <span>Diagonal</span></label>
        <label class="radio-pill"><input type="radio" name="wm-pos" value="center"> <span>Center</span></label>
        <label class="radio-pill"><input type="radio" name="wm-pos" value="tile"> <span>Tiled</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Pages</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="wm-pages" value="all" checked> <span>All Pages</span></label>
        <label class="radio-pill"><input type="radio" name="wm-pages" value="odd"> <span>Odd</span></label>
        <label class="radio-pill"><input type="radio" name="wm-pages" value="even"> <span>Even</span></label>
      </div>
    </div>
  </div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Apply Watermark</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const actionRow = $('#action-row'), summary = $('#summary');
  const wmSize = $('#wm-size'), sizeVal = $('#size-val'), wmOp = $('#wm-opacity'), opVal = $('#op-val');
  let currentFile = null, pdfDoc = null, srcBytes = null;

  wmSize.addEventListener('input', () => sizeVal.textContent = wmSize.value);
  wmOp.addEventListener('input', () => opVal.textContent = wmOp.value + '%');

  async function loadFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Please select a PDF', 'error'); return; }
    currentFile = file;
    const ab = await file.arrayBuffer();
    const { PDFDocument } = await getPdfLib();
    srcBytes = ab; pdfDoc = await PDFDocument.load(ab, { ignoreEncryption: true });
    controls.hidden = false; actionRow.hidden = false;
    toast('PDF loaded: ' + pdfDoc.getPageCount() + ' pages', 'success');
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!pdfDoc) return;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Applying...';
    try {
      const { PDFDocument, rgb, StandardFonts, degrees } = await getPdfLib();
      // Start from the original file every time, so changing settings and re-applying never stacks on an earlier result.
      const pdfDoc = await PDFDocument.load(srcBytes, { ignoreEncryption: true });
      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const text = $('#wm-text').value || 'WATERMARK';
      const baseSize = parseInt(wmSize.value);
      const opacity = parseInt(wmOp.value) / 100;
      const colorMap = { gray: rgb(0.5,0.5,0.5), red: rgb(0.9,0.1,0.1), blue: rgb(0.1,0.2,0.9) };
      const color = colorMap[document.querySelector('input[name=wm-color]:checked').value];
      const pos = document.querySelector('input[name=wm-pos]:checked').value;
      const pages = pdfDoc.getPages();
      const pagesFilter = document.querySelector('input[name=wm-pages]:checked').value;

      pages.forEach((page, i) => {
        if (pagesFilter === 'odd' && i % 2 === 1) return;
        if (pagesFilter === 'even' && i % 2 === 0) return;
        const { width, height } = page.getSize();
        const fontSize = Math.max(8, Math.round(baseSize * Math.min(width, height) / 595)); // relative to an A4 page
        const tw = font.widthOfTextAtSize(text, fontSize);

        if (pos === 'diagonal') {
          const a = Math.PI / 4, hh = fontSize * 0.35; // rotate about the text's centre so it sits mid-page
          page.drawText(text, { x: width / 2 - (tw / 2) * Math.cos(a) + hh * Math.sin(a), y: height / 2 - (tw / 2) * Math.sin(a) - hh * Math.cos(a), size: fontSize, font, color, opacity, rotate: degrees(45) });
        } else if (pos === 'center') {
          page.drawText(text, { x: (width - tw) / 2, y: (height - fontSize) / 2, size: fontSize, font, color, opacity });
        } else {
          // tiled
          const step = tw + 60;
          for (let x = -width; x < width * 2; x += step) {
            for (let y = 0; y < height; y += fontSize * 3) {
              page.drawText(text, { x, y, size: Math.round(fontSize * 0.6), font, color, opacity, rotate: degrees(30) });
            }
          }
        }
      });

      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>Watermark applied to ${pages.length} pages &rarr; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      $('#dl-btn').addEventListener('click', () => download(blob, stem(currentFile.name) + '_watermarked.pdf'));
      toast('Watermark applied!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Apply Watermark';
  });

  fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); });
  setupDrop(drop, files => loadFile(files[0]));
  $('#reset-btn').addEventListener('click', () => {
    currentFile = null; pdfDoc = null; srcBytes = null;
    controls.hidden = true; actionRow.hidden = true; summary.hidden = true; fileIn.value = '';
  });
})();
</script>
</body>
</html>
