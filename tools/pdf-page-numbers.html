<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add Page Numbers - Squeeze</title>
<meta name="description" content="Add page numbers to PDF offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#f97316,#eab308)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      </div>
      <div class="tool-page-title"><h1>Add Page Numbers</h1><p>Insert page numbers as header or footer in your PDF</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:700px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept=".pdf,application/pdf">
    <span class="drop-icon">&#128196;</span>
    <p class="drop-text">Drop your PDF here</p>
    <p class="drop-hint">Page numbers will be added to every page</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Position</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="pos" value="bottom-center" checked> <span>Bottom Center</span></label>
        <label class="radio-pill"><input type="radio" name="pos" value="bottom-right"> <span>Bottom Right</span></label>
        <label class="radio-pill"><input type="radio" name="pos" value="top-center"> <span>Top Center</span></label>
        <label class="radio-pill"><input type="radio" name="pos" value="top-right"> <span>Top Right</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Format</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="fmt" value="n" checked> <span>1, 2, 3...</span></label>
        <label class="radio-pill"><input type="radio" name="fmt" value="n-of-N"> <span>1 of 10</span></label>
        <label class="radio-pill"><input type="radio" name="fmt" value="Page-n"> <span>Page 1</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Font Size</span>
      <div class="slider-wrap">
        <input type="range" id="font-sz" min="8" max="24" value="12">
        <span class="slider-val" id="fs-val">12pt</span>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Start Number</span>
      <input type="number" id="start-num" value="1" min="0" style="width:80px">
    </div>
    <div class="control-row">
      <span class="control-label">Skip First Page</span>
      <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer"><input type="checkbox" id="skip-first"> Skip first page (title page)</label>
    </div>
  </div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Add Page Numbers</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const actionRow = $('#action-row'), summary = $('#summary');
  const fontSz = $('#font-sz'), fsVal = $('#fs-val');
  let currentFile = null, pdfDoc = null;

  fontSz.addEventListener('input', () => fsVal.textContent = fontSz.value + 'pt');

  async function loadFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Please select a PDF', 'error'); return; }
    currentFile = file;
    const ab = await file.arrayBuffer();
    const { PDFDocument } = await getPdfLib();
    pdfDoc = await PDFDocument.load(ab, { ignoreEncryption: true });
    controls.hidden = false; actionRow.hidden = false;
    toast(pdfDoc.getPageCount() + ' pages loaded', 'success');
  }

  $('#run-btn').addEventListener('click', async () => {
    if (!pdfDoc) return;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Adding numbers...';
    try {
      const { PDFDocument, StandardFonts, rgb } = await getPdfLib();
      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const sz = parseInt(fontSz.value);
      const startNum = parseInt($('#start-num').value) || 1;
      const skipFirst = $('#skip-first').checked;
      const pos = document.querySelector('input[name=pos]:checked').value;
      const numFmt = document.querySelector('input[name=fmt]:checked').value;
      const total = pdfDoc.getPageCount();
      const pages = pdfDoc.getPages();
      const margin = 24;

      pages.forEach((page, i) => {
        if (skipFirst && i === 0) return;
        const { width, height } = page.getSize();
        const num = startNum + (skipFirst ? i - 1 : i);
        let text = String(num);
        if (numFmt === 'n-of-N') text = num + ' of ' + (skipFirst ? total - 1 : total);
        if (numFmt === 'Page-n') text = 'Page ' + num;
        const tw = font.widthOfTextAtSize(text, sz);
        let x = margin, y = margin;
        if (pos.includes('center')) x = (width - tw) / 2;
        if (pos.includes('right')) x = width - tw - margin;
        if (pos.includes('top')) y = height - sz - margin;
        page.drawText(text, { x, y, size: sz, font, color: rgb(0.3,0.3,0.3), opacity: 0.7 });
      });

      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>Page numbers added &rarr; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      $('#dl-btn').addEventListener('click', () => download(blob, stem(currentFile.name) + '_numbered.pdf'));
      toast('Page numbers added!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Add Page Numbers';
  });

  fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); });
  setupDrop(drop, files => loadFile(files[0]));
  $('#reset-btn').addEventListener('click', () => { currentFile = null; pdfDoc = null; controls.hidden = true; actionRow.hidden = true; summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
