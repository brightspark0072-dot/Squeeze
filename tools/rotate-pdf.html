<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotate PDF - Squeeze</title>
<meta name="description" content="Rotate PDF pages offline.">
<meta name="theme-color" content="#2A4058">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#10b981,#06b6d4)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M21.5 2v6h-6"/><path d="M2.5 12A10 10 0 0 1 19.5 5.3L21.5 8"/><path d="M2.5 22v-6h6"/><path d="M21.5 12A10 10 0 0 1 4.5 18.7L2.5 16"/></svg>
      </div>
      <div class="tool-page-title"><h1>Rotate PDF</h1><p>Click rotation buttons on each page, then save</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:900px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept=".pdf,application/pdf">
    <span class="drop-icon">&#128196;</span>
    <p class="drop-text">Drop your PDF here</p>
    <p class="drop-hint">Then rotate individual pages or all at once</p>
  </div>
  <div id="ctrl-bar" hidden style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center">
    <button class="btn-secondary" id="rot-all-ccw">&#8634; Rotate All -90&#176;</button>
    <button class="btn-secondary" id="rot-all-cw">&#8635; Rotate All +90&#176;</button>
    <button class="btn-secondary" id="rot-all-180">&#8635;&#8634; Rotate All 180&#176;</button>
    <button class="btn-secondary" id="reset-rot">Reset Rotations</button>
  </div>
  <div class="page-grid" id="page-grid"></div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="save-btn">&#9889; Save Rotated PDF</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), pageGrid = $('#page-grid');
  const actionRow = $('#action-row'), summary = $('#summary'), ctrlBar = $('#ctrl-bar');
  let pdfDoc = null, pdfJsDoc = null, totalPages = 0, rotations = [], srcName = 'document';

  async function loadPdf(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Please select a PDF', 'error'); return; }
    toast('Loading...', 'info');
    try {
      const ab = await file.arrayBuffer(); srcName = stem(file.name);
      const { PDFDocument } = await getPdfLib();
      pdfDoc = await PDFDocument.load(ab, { ignoreEncryption: true });
      totalPages = pdfDoc.getPageCount();
      rotations = Array(totalPages).fill(0);
      const pdfjsLib = await getPdfJs();
      pdfJsDoc = await pdfjsLib.getDocument({ data: new Uint8Array(ab) }).promise;
      await renderPages();
      ctrlBar.hidden = false; ctrlBar.style.display = 'flex'; actionRow.hidden = false;
    } catch(e) { toast('Error: ' + e.message, 'error'); }
  }

  async function renderPages() {
    pageGrid.innerHTML = '';
    for (let i = 0; i < totalPages; i++) {
      const thumb = document.createElement('div');
      thumb.className = 'page-thumb';
      thumb.dataset.idx = i;
      thumb.innerHTML = `
        <div style="font-size:.7rem;color:var(--mu)">Loading...</div>
        <div class="rot-btns">
          <button class="rot-btn" title="Rotate -90" onclick="rotate(${i},-90)">&#8634;</button>
          <button class="rot-btn" title="Flip 180" onclick="rotate(${i},180)">&#8635;&#8634;</button>
          <button class="rot-btn" title="Rotate +90" onclick="rotate(${i},90)">&#8635;</button>
        </div>
        <div class="rot-badge" id="rbadge-${i}"></div>
        <div class="page-num">Page ${i+1}</div>`;
      pageGrid.appendChild(thumb);
      (async (idx, el) => {
        try {
          const canvas = await renderPage(pdfJsDoc, idx + 1, 0.3);
          canvas.id = 'canvas-' + idx;
          el.insertBefore(canvas, el.querySelector('.rot-btns'));
          el.querySelector('div').remove();
        } catch {}
      })(i, thumb);
    }
  }

  window.rotate = (idx, deg) => {
    rotations[idx] = ((rotations[idx] + deg) % 360 + 360) % 360;
    const c = $('#canvas-' + idx);
    if (c) c.style.transform = 'rotate(' + rotations[idx] + 'deg)';
    const badge = $('#rbadge-' + idx);
    if (badge) { badge.style.display = rotations[idx] ? 'block' : 'none'; badge.textContent = rotations[idx] + '°'; }
  };

  $('#rot-all-cw').addEventListener('click', () => { for (let i = 0; i < totalPages; i++) rotate(i, 90); });
  $('#rot-all-ccw').addEventListener('click', () => { for (let i = 0; i < totalPages; i++) rotate(i, -90); });
  $('#rot-all-180').addEventListener('click', () => { for (let i = 0; i < totalPages; i++) rotate(i, 180); });
  $('#reset-rot').addEventListener('click', () => { for (let i = 0; i < totalPages; i++) { rotations[i] = 0; const c = $('#canvas-' + i); if (c) c.style.transform = ''; const b = $('#rbadge-' + i); if (b) b.style.display = 'none'; } });

  $('#save-btn').addEventListener('click', async () => {
    try {
      const { PDFDocument, degrees } = await getPdfLib();
      const ab = await pdfDoc.context.doc ? null : null;
      // re-save current pdfDoc after applying rotations
      const pages = pdfDoc.getPages();
      pages.forEach((p, i) => {
        if (rotations[i]) {
          const cur = p.getRotation().angle;
          p.setRotation(degrees((cur + rotations[i]) % 360));
        }
      });
      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>Rotated PDF ready &mdash; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      $('#dl-btn').addEventListener('click', () => download(blob, srcName + '_rotated.pdf'));
      toast('PDF rotated!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
  });

  fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadPdf(fileIn.files[0]); });
  setupDrop(drop, files => loadPdf(files[0]));
  $('#reset-btn').addEventListener('click', () => {
    pdfDoc = null; pdfJsDoc = null; totalPages = 0; rotations = [];
    pageGrid.innerHTML = ''; ctrlBar.hidden = true; actionRow.hidden = true; summary.hidden = true; fileIn.value = '';
  });
})();
</script>
</body>
</html>
